name: sbomscan-keygen-poc

x-keygen: &keygen
  image: keygen/api:v1.7.2
  env_file: .env
  environment:
    DATABASE_URL: postgres://keygen:${POSTGRES_PASSWORD}@postgres:5432/keygen
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  runtime-permissions:
    image: alpine:3.22
    user: "0:0"
    restart: "no"
    volumes:
      - ./.runtime:/runtime
    command:
      - sh
      - -ec
      - |
        chown 1000:1000 /runtime
        chmod 750 /runtime
        if [ -f /runtime/bootstrap.log ]; then
          chown 1000:1000 /runtime/bootstrap.log
          chmod 600 /runtime/bootstrap.log
        fi

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: keygen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keygen
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keygen -d keygen]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30

  setup:
    <<: *keygen
    restart: "no"
    entrypoint: [bundle, exec, ruby, /bootstrap/database.rb]
    volumes:
      - ./bootstrap-database.rb:/bootstrap/database.rb:ro
      - ./.runtime:/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-permissions:
        condition: service_completed_successfully

  web:
    <<: *keygen
    command: web
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:3000/v1/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    <<: *keygen
    command: worker
    depends_on:
      setup:
        condition: service_completed_successfully

  portal:
    pull_policy: build
    build:
      context: .
      dockerfile: portal.Dockerfile
      args:
        KEYGEN_ACCOUNT_ID: ${KEYGEN_ACCOUNT_ID}
        KEYGEN_ADMIN_EMAIL: ${KEYGEN_ADMIN_EMAIL:-admin@example.com}
    image: sbomscan-keygen-portal:poc

  gateway:
    image: caddy:2.10.2-alpine
    networks:
      default:
        aliases: [keygen.localhost]
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      portal:
        condition: service_started

  catalog:
    image: python:3.12-alpine
    restart: "no"
    network_mode: service:gateway
    working_dir: /workspace
    command: [python, -u, bootstrap-catalog.py]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      LICENSE_PUBLIC_URL: ${LICENSE_PUBLIC_URL:-https://localhost:8443}
      LICENSE_BOOTSTRAP_CATALOG: ${LICENSE_BOOTSTRAP_CATALOG:-true}
    volumes:
      - ./bootstrap-catalog.py:/workspace/bootstrap-catalog.py:ro
      - ./poc.py:/workspace/poc.py:ro
      - ./smoke.py:/workspace/smoke.py:ro
      - ./product.py:/workspace/product.py:ro
      - ./.env:/workspace/.env:ro
      - ./.runtime:/workspace/.runtime
      - caddy_data:/caddy-data:ro
    depends_on:
      gateway:
        condition: service_started
      web:
        condition: service_healthy

volumes:
  postgres:
  redis:
  caddy_data:
  caddy_config:
